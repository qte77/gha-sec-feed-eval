---
# Software Bill of Materials generation via qte77/gha-sbom-action.
# https://github.com/qte77/gha-sbom-action
#
# Triggers: push to main on dep tree changes, weekly Sunday cron,
# manual dispatch. Outputs committed under docs/SBOM/ via auto-PR.
name: Generate SBOM

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: qte77/gha-sbom-action@35cad9a48b372e6d552637a101ad5956f41e2463  # v0.1.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
