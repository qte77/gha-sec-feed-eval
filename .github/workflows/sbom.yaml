---
# Software Bill of Materials generation via qte77/gha-sbom-action.
# https://github.com/qte77/gha-sbom-action
#
# Triggers: push to main on dep tree changes, weekly Sunday cron,
# manual dispatch. Outputs committed under docs/SBOM/ via auto-PR.
name: Generate SBOM

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: qte77/gha-sbom-action@cd873b1278a6793a99cfe199c01d603d72cca717  # v0.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
