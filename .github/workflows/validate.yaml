---
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint + types + complexity + lint_md + lint_links + test_cov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev + test dependencies
        run: uv sync --frozen --group dev --group test

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright src

      - name: Complexipy cognitive complexity (max 10)
        run: uv run complexipy src --max-complexity-allowed 10

      - name: Markdownlint
        run: |
          npx --yes markdownlint-cli --config .markdownlint.json '**/*.md' \
            --ignore '.venv/**' --ignore 'node_modules/**' \
            --ignore 'changelog.d/**'

      - name: Pytest with coverage
        run: uv run pytest --cov=src --cov-fail-under=70
